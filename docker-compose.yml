services:
  mern-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern_monorepo_container
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_URL=http://api:5000
    depends_on:
      - api

  # The movie-reviews API, built straight from its own repo.
  # Set API_REPO to a local path (e.g. ../cop4331-mern-backend) to build from a checkout instead.
  api:
    build:
      context: ${API_REPO:-https://github.com/Fall2026-Classes/cop4331-mern-backend.git#main}
    container_name: mern_api_container
    restart: unless-stopped
    command: npm start
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb_service:27017/MovieReviewsDB
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      - mongodb_service

  mongodb_service:
    image: mongo:latest
    container_name: mern_mongodb_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mern_db_data:/data/db

volumes:
  mern_db_data:
